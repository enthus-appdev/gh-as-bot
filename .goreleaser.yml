version: 2

builds:
  - binary: gh-as-bot
    main: ./cmd/gh-as-bot
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  # `gh extension install` picks a release asset using
  # `strings.HasSuffix(name, "{os}-{arch}" [+".exe"])` — see `installBin`
  # in pkg/cmd/extension/manager.go in cli/cli. That literal suffix match
  # has two hard requirements:
  #   1. Raw binaries only. There is no archive-extraction logic in the
  #      installer — `.tar.gz` / `.zip` assets are ignored regardless of
  #      how they're named.
  #   2. Hyphen separator between OS and arch. `os_arch` does not match
  #      `HasSuffix(..., "os-arch")`.
  # Both must hold. Matches the pattern proven out in gh-attach.
  - formats: ['binary']
    name_template: "{{ .Os }}-{{ .Arch }}"

changelog:
  sort: asc
